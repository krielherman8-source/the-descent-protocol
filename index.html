<div id="load">LOADING THE DESCENT PROTOCOL…</div><script type="module">
'use strict';
let THREE;
try{THREE=await import('three')}catch(e){console.warn('three via import map failed, trying CDN',e);THREE=await import('https://unpkg.com/three@0.160.0/build/three.module.js')}
let ADDONS=null;try{const m=await Promise.all(['EffectComposer','RenderPass','UnrealBloomPass','OutputPass','ShaderPass'].map(n=>import(`three/addons/postprocessing/${n}.js`)));ADDONS=Object.assign({},...m)}catch(e){console.warn('postprocessing unavailable — bloom off',e)}
document.getElementById('load').remove();
// ================= CONSTANTS / HELPERS =================
const W=1280,H=720,CELL=32,GW=40,GH=23;
const rnd=(a,b)=>a+Math.random()*(b-a),pickR=a=>a[Math.floor(Math.random()*a.length)],dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const cp=c=>c*CELL+CELL/2,P=(cx,cy)=>({x:cp(cx),y:cp(cy)}),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const angDiff=(a,b)=>((a-b+Math.PI*3)%(Math.PI*2))-Math.PI;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

// ================= WEAPONS =================
const WEAPONS={
 kinetic:{name:'Kinetic Rifle',desc:'Accurate automatic rifle',rate:9,implemented:true,
  fire:(p,a)=>shoot(p,a,{dmg:12,speed:900,spread:.04,life:1.2,col:'#7ff'})},
 pulse_shotgun:{name:'Pulse Shotgun',desc:'7-pellet close-range blast',rate:1.6,implemented:true,
  fire:(p,a)=>{for(let i=0;i<7;i++)shoot(p,a,{dmg:10,speed:rnd(650,820),spread:.32,life:.42,col:'#9cf',r:3})}},
 flamethrower:{name:'Flamethrower',desc:'Piercing flames, sets enemies ablaze, x2 vs biomass',rate:28,implemented:true,
  fire:(p,a)=>shoot(p,a,{dmg:2.6,speed:rnd(340,440),spread:.22,life:.38,col:'#fa4',r:5,pierce:true,burn:2.5,flame:true})},
 tesla:{name:'Tesla Arc Cannon',desc:'Hitscan arc chains through 5 targets',rate:2.3,implemented:true,
  fire:(p,a)=>teslaArc(p,a,26)},
 grenade_launcher:{name:'Grenade Launcher',desc:'Lobbed grenades blast a wide area',rate:1.2,implemented:true,
  fire:(p,a)=>shoot(p,a,{dmg:16,speed:560,spread:.03,life:.85,col:'#fd6',r:6,grenade:{r:85,dmg:42}})},
 railgun:{name:'Needle Railgun',desc:'Hitscan needle pierces every enemy in a line',rate:1.15,implemented:true,
  fire:(p,a)=>railShot(p,a,70)},
 bio_harvester:{name:'Bio-Harvester',desc:'Leech beam drains enemies and heals you',rate:10,implemented:true,
  fire:(p,a)=>leechBeam(p,a,5.5)},
};
// Mods attach to a specific weapon (p.mods[weaponKey]); effects apply on that weapon's hits. Proc chances scale with weapon fire rate.
const MODS={
 explosive:{name:'Explosive Tips',short:'EXP',color:'#fa5',desc:'Hits can detonate a small blast',implemented:true},
 cryo:{name:'Cryo Chamber',short:'CRY',color:'#8df',desc:'Hits chill enemies (50% slow, 2s)',implemented:true},
 vampiric:{name:'Vampiric Coil',short:'VAM',color:'#f46',desc:'Heal 6% of damage dealt',implemented:true},
 emp:{name:'EMP Converter',short:'EMP',color:'#ff6',desc:'Hits can stun enemies briefly',implemented:true},
};

// ================= DRONES =================
const DRONES={
 aegis:{name:'Aegis',desc:'Orbits you and shoots the nearest enemy',orbit:46,spin:2.2,color:'#4fc',implemented:true,
  update(p,dt){p.dcd-=dt;if(p.dcd>0)return;let best=null,bd=330;for(const e of S.enemies){const d=dist(e,p.dpos);if(e.hp>0&&d<bd&&los(p.dpos,e)){bd=d;best=e}}
   if(best){sfx('drone');p.dcd=1/(2.5*p.droneRateMul);S.bullets.push(mkBullet(p.dpos.x,p.dpos.y,Math.atan2(best.y-p.dpos.y,best.x-p.dpos.x),{dmg:7*p.dmgMul,speed:720,life:1,col:'#4fc',r:2.5}))}}},
 torchlet:{name:'Torchlet',desc:'Sweeps a wide orbit burning everything it touches',orbit:75,spin:3.4,color:'#fa4',implemented:true,
  update(p,dt){for(const e of S.enemies){if(e.hp>0&&dist(e,p.dpos)<e.r+42){damage(e,26*p.droneRateMul*p.dmgMul*dt,{burn:1.5})}}
   if(Math.random()<.6)S.parts.push({x:p.dpos.x+rnd(-12,12),y:p.dpos.y+rnd(-12,12),vx:rnd(-30,30),vy:rnd(-30,30),life:.3,col:'#f84'})}},
 bastion:{name:'Bastion',desc:'Regenerating shield blocks a hit; periodic knockback pulse',orbit:28,spin:1.2,color:'#8af',implemented:true,
  update(p,dt){if(!p.shield){p.shieldT-=dt*p.droneRateMul;if(p.shieldT<=0)p.shield=true}
   p.pulseT-=dt*p.droneRateMul;if(p.pulseT<=0){p.pulseT=5;S.rings.push({x:p.x,y:p.y,r:10,life:.4});
    for(const e of S.enemies){const d=dist(e,p);if(d<150&&d>0&&!ENEMIES[e.type].boss){e.x+=(e.x-p.x)/d*70;e.y+=(e.y-p.y)/d*70;resolve(e);damage(e,18*p.dmgMul)}}}}},
 needler:{name:'Needler',desc:'Fires piercing 3-needle bursts at the toughest enemy nearby',orbit:52,spin:2.8,color:'#c8f',implemented:true,
  update(p,dt){p.dcd-=dt;if(p.dcd>0)return;let best=null,bh=0;for(const e of S.enemies){if(e.hp>0&&e.hp>bh&&dist(e,p.dpos)<420&&los(p.dpos,e)){bh=e.hp;best=e}}
   if(best){sfx('drone');p.burstN=(p.burstN||0)+1;p.dcd=p.burstN%3?.09:1.1/p.droneRateMul;const a=Math.atan2(best.y-p.dpos.y,best.x-p.dpos.x);
    S.bullets.push(mkBullet(p.dpos.x,p.dpos.y,a+rnd(-.04,.04),{dmg:11*p.dmgMul,speed:1100,life:.6,col:'#e9f',r:2,pierce:true}))}}},
 harvestor:{name:'Harvestor',desc:'Kills drop bio-orbs; the drone flies out to collect them and heals you',orbit:40,spin:2,color:'#7f5',implemented:true,
  update(p,dt){let tgt=null,bd=600;for(const o of S.orbs){const d=dist(o,p);if(d<bd){bd=d;tgt=o}}
   const goal=tgt||{x:p.x+Math.cos(p.da)*40,y:p.y+Math.sin(p.da)*40},h=p.hpos,d=dist(goal,h),sp=440*p.droneRateMul*dt;
   if(d>sp){h.x+=(goal.x-h.x)/d*sp;h.y+=(goal.y-h.y)/d*sp}else{h.x=goal.x;h.y=goal.y}
   if(tgt&&dist(tgt,h)<16){tgt.life=0;p.hp=Math.min(p.maxHp,p.hp+5);S.stats.healed+=5;S.stats.orbs++;sfx('heal');floatText(p.x,p.y-30,'+5 HP','#7f5');burst(tgt.x,tgt.y,'#7f5',10)}
   p.dpos={x:h.x,y:h.y};p.dcd-=dt;if(p.dcd<=0){p.dcd=.5;for(const e of S.enemies)if(e.hp>0&&dist(e,h)<40){damage(e,6*p.dmgMul);break}}}},
 specter:{name:'Specter',desc:'Projects a hologram decoy that lures the swarm, then detonates',orbit:34,spin:1.6,color:'#9ef',implemented:true,
  update(p,dt){p.decoyT=(p.decoyT??2)-dt*p.droneRateMul;if(p.decoyT<=0&&S.enemies.length&&!S.decoy){p.decoyT=9;S.decoy={x:p.x,y:p.y,life:4.5};S.stats.decoys++;
   S.rings.push({x:p.x,y:p.y,r:10,life:.4,col:'#9ef'});floatText(p.x,p.y-30,'DECOY DEPLOYED','#9ef')}}},
};

// ================= ENEMIES =================
const ENEMIES={
 swarmer:{name:'Swarmer',hp:20,speed:110,dmg:10,r:9,color:'#7cff4f',ai:'chase'},
 runner:{name:'Runner',hp:12,speed:185,dmg:6,r:7,color:'#d4ff3a',ai:'chase'},
 brute:{name:'Brute',hp:90,speed:62,dmg:25,r:16,color:'#ff6a3d',ai:'chase'},
 spitter:{name:'Spitter',hp:30,speed:80,dmg:8,r:10,color:'#c66bff',ai:'ranged'},
 exploder:{name:'Bloater',hp:25,speed:135,dmg:30,r:11,color:'#ffcc33',ai:'explode'},
 stalker:{name:'Stalker',hp:45,speed:150,dmg:18,r:10,color:'#5fe8d0',ai:'chase',cloak:true},
 leaper:{name:'Leaper',hp:40,speed:95,dmg:16,r:10,color:'#ff8c3a',ai:'leap'},
 carrier:{name:'Brood Carrier',hp:140,speed:55,dmg:20,r:18,color:'#c8b04a',ai:'chase',split:'mite'},
 mite:{name:'Mite',hp:6,speed:205,dmg:4,r:5,color:'#ffef7a',ai:'chase'},
 warden:{name:'Brood Warden',hp:1450,speed:55,dmg:24,r:38,color:'#ff3d7a',ai:'boss',boss:true},
 prime:{name:'Swarmer Prime',hp:4400,speed:110,dmg:22,r:26,color:'#ff5533',ai:'boss',boss:true},
 colossus:{name:'Hive Colossus',hp:6800,speed:48,dmg:28,r:46,color:'#b04aff',ai:'boss',boss:true},
 matriarch:{name:'Hive Matriarch',hp:7400,speed:40,dmg:24,r:42,color:'#ff4fa0',ai:'boss',boss:true},
 overmind:{name:'The Overmind',hp:16000,speed:0,dmg:40,r:56,color:'#ff2050',ai:'boss',boss:true},
};

// ================= UPGRADES =================
const UPGRADES=[
 {name:'+25% Damage',desc:'All weapons & drones',apply:p=>p.dmgMul*=1.25},
 {name:'+20% Fire Rate',desc:'All weapons',apply:p=>p.rateMul*=1.2},
 {name:'+12% Move Speed',desc:'Run faster',apply:p=>p.speed*=1.12},
 {name:'+25 Max HP',desc:'And heal 25',apply:p=>{p.maxHp+=25;p.hp+=25}},
 {name:'+35% Drone Power',desc:'Drone rate / dps / recharge',apply:p=>p.droneRateMul*=1.35},
 {name:'Multishot +1',desc:'Extra projectile per shot',apply:p=>p.multishot++},
 {name:'Full Repair',desc:'Restore all HP',apply:p=>p.hp=p.maxHp},
];

// ================= OBJECTIVES =================
const mkItem=o=>{const it=Object.assign({prog:0,done:false,active:true,r:18,time:2},o);if(window.TDP_SETTINGS)it.color=TDP_SETTINGS.itemColor(it);return it};
const holdItems=(f,label,color,time,extra)=>f.points.map(([cx,cy],i)=>mkItem(Object.assign({kind:'hold',...P(cx,cy),label,color,time,idx:i},extra||{})));
const shootItems=(f,label,color,hp,extra)=>f.points.map(([cx,cy],i)=>mkItem(Object.assign({kind:'shoot',...P(cx,cy),label,color,hp,max:hp,r:20,idx:i},extra||{})));
const nDone=S=>S.items.filter(i=>i.done).length,allDone=S=>S.items.every(i=>i.done);
const OBJECTIVES={
 generators:{label:'Restore power',setup:(S,f)=>{S.items=holdItems(f,f.label||'GENERATOR','#3ff',2)},progress:S=>`${S.f.label||'Generator'}s online ${nDone(S)}/${S.items.length}  (${useHint().toLowerCase()})`,done:allDone},
 lockers:{label:'Unlock heavy weapon lockers',setup:(S,f)=>{S.items=holdItems(f,'LOCKER','#6cf',1.4);const wi=Math.floor(rnd(0,S.items.length));
   S.items.forEach(it=>it.onDone=()=>lootLocker(it,it.idx===wi))},progress:S=>`Lockers opened ${nDone(S)}/${S.items.length}  (${useHint().toLowerCase()})`,done:allDone},
 maglocks:{label:'Disable magnetic locks',setup:(S,f)=>{S.items=holdItems(f,'MAG-LOCK','#a8f',2);S.well=P(20,11)},
  update(dt,S){const rem=S.items.filter(i=>!i.done).length;if(!rem)return;const p=S.p,str=230*rem/S.items.length,d=dist(p,S.well);
   if(d>4){const k=clamp(1-d/1000,.15,1);p.x+=(S.well.x-p.x)/d*str*k*dt;p.y+=(S.well.y-p.y)/d*str*k*dt}
   if(d<45&&!S.god){const a=22*dt*DF().dmg;p.hp-=a;S.stats.taken+=a}for(const e of S.enemies){const de=dist(e,S.well);if(de>4){e.x+=(S.well.x-e.x)/de*str*.3*dt;e.y+=(S.well.y-e.y)/de*str*.3*dt}}},
  progress:S=>`Mag-locks disabled ${nDone(S)}/${S.items.length}  — resist the gravity well`,done:allDone},
 beacons:{label:'Navigate in darkness',setup:(S,f)=>{S.items=f.points.map(([cx,cy],i)=>mkItem({kind:'touch',...P(cx,cy),label:'BEACON '+(i+1),color:'#3ff',idx:i}))},
  update(dt,S){const n=S.items.findIndex(i=>!i.done);S.items.forEach((it,i)=>it.active=i===n)},
  progress:S=>`Relay beacons in order ${nDone(S)}/${S.items.length}`,done:allDone},
 biomass:{label:'Burn alien biomass',setup:(S,f)=>{S.items=shootItems(f,'BIOMASS','#9f3',200*(1+S.floor*.05),{burnBonus:true,r:24,spawnT:rnd(3,6)})},
  update(dt,S){for(const it of S.items){if(it.done)continue;it.spawnT-=dt;if(it.spawnT<=0){it.spawnT=6.5;spawnNear('swarmer',it.x,it.y,2)}}},
  progress:S=>`Biomass burned ${nDone(S)}/${S.items.length}  (shoot it — flames x2)`,done:allDone},
 hack:{label:'Hack reactor terminals',setup:(S,f)=>{S.items=holdItems(f,'TERMINAL','#3fc',3.5,{decay:.2})},
  update(dt,S){for(const it of S.items)if(it.prog>0&&!it.alarm){it.alarm=true;floatText(it.x,it.y-30,'ALARM!','#f66');spawnNear('swarmer',it.x,it.y,3,180)}},
  progress:S=>`Terminals hacked ${nDone(S)}/${S.items.length}  (stay close, progress decays)`,done:allDone},
 vents:{label:'Redirect airflow safely',setup:(S,f)=>{S.items=holdItems(f,'VALVE','#7df',2);S.winds=f.winds},
  update(dt,S){const p=S.p;for(const z of S.winds){if(S.items[z.valve].done)continue;if(p.y>z.y0&&p.y<z.y1)p.x+=z.vx*dt*(S.holding&&useOn()?.45:1);
   for(const e of S.enemies)if(e.y>z.y0&&e.y<z.y1)e.x+=z.vx*.5*dt}},
  progress:S=>`Valves sealed ${nDone(S)}/${S.items.length}  — each stops one air current`,done:allDone},
 purge:{label:'Purge infestation',setup:(S,f)=>{S.items=shootItems(f,'SPORE NODE','#bf4',140*(1+S.floor*.05),{burnBonus:true,muck:95})},
  update(dt,S){const p=S.p;for(const it of S.items)if(!it.done&&dist(it,p)<it.muck){if(!S.god){const a=7*dt*DF().dmg;p.hp-=a;S.stats.taken+=a}p.slow=.55}},
  progress:S=>`Spore nodes purged ${nDone(S)}/${S.items.length}  (avoid the muck)`,done:allDone},
 reboot:{label:'Reboot core systems',setup:(S,f)=>{S.items=holdItems(f,'CORE NODE','#5ff',1.5);S.rebootT=0},
  update(dt,S){const n=nDone(S);if(n>0&&n<S.items.length){S.rebootT-=dt;if(S.rebootT<=0){S.items.forEach(i=>{i.done=false;i.prog=0});floatText(S.p.x,S.p.y-30,'REBOOT FAILED — NODES RESET','#f66')}}
   else if(n===0)S.rebootT=S.f.window||30},
  progress:S=>{const n=nDone(S);return `Core nodes ${n}/${S.items.length}`+(n>0&&n<S.items.length?`  — ${Math.ceil(S.rebootT)}s left before reset!`:`  (all within ${S.f.window||30}s)`)},done:allDone},
 reactor:{label:'Stabilize the reactor',setup:(S,f)=>{S.items=[mkItem({kind:'zone',...P(20,11),r:110,label:'REACTOR CORE',color:'#ffb040',time:f.zoneTime||25})];S.pulseT=7},
  update(dt,S){const z=S.items[0];if(z.done)return;S.pulseT-=dt;if(S.pulseT<=0){S.pulseT=7;S.rings.push({x:z.x,y:z.y,r:10,life:.5,col:'#ffb040'});if(dist(S.p,z)<z.r)hurtPlayer(10);floatText(z.x,z.y-40,'REACTOR PULSE','#fb4')}},
