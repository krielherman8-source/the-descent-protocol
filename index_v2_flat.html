const W=1280,H=720,CELL=32,GW=40,GH=23;
const rnd=(a,b)=>a+Math.random()*(b-a),pickR=a=>a[Math.floor(Math.random()*a.length)],dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const cp=c=>c*CELL+CELL/2,P=(cx,cy)=>({x:cp(cx),y:cp(cy)}),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const angDiff=(a,b)=>((a-b+Math.PI*3)%(Math.PI*2))-Math.PI;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

 vents:{label:'Redirect airflow safely',setup:(S,f)=>{S.items=holdItems(f,'VALVE','#7df',2);S.winds=f.winds},

   S.door=mkItem({kind:'hold',...P(...f.door),label:'SECURITY DOOR',color:'#f5a',time:2,active:false,onDone:()=>{S.bossSpawned=true;const b=spawnEnemy('warden',cp(20),cp(4));

  progress:S=>!S.door.done?`Keycards ${S.cards}/3`+(S.cards>=3?'  — open the SECURITY DOOR (hold E)':'  (shoot cocoons)'):S.enemies.some(e=>ENEMIES[e.type].boss)?'Kill the Brood Warden!':'Done',
  done:S=>S.door.done&&S.bossSpawned&&!S.enemies.some(e=>ENEMIES[e.type].boss)},

// ================= SETUP / INPUT =================
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let sc=1,ox=0,oy=0;
function resize(){cv.width=innerWidth;cv.height=innerHeight;sc=Math.min(innerWidth/W,innerHeight/H);ox=(innerWidth-W*sc)/2;oy=(innerHeight-H*sc)/2}
addEventListener('resize',resize);resize();
const darkC=document.createElement('canvas');darkC.width=W;darkC.height=H;const dctx=darkC.getContext('2d');
const keys={},mouse={x:W/2,y:H/2,down:false};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;onKey(k)});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
cv.addEventListener('mousemove',e=>{mouse.x=(e.clientX-ox)/sc;mouse.y=(e.clientY-oy)/sc});
cv.addEventListener('mousedown',e=>{mouse.down=true;onClick()});addEventListener('mouseup',()=>mouse.down=false);

let S;
function newPlayer(){return{x:0,y:0,r:12,hp:100,maxHp:100,speed:230,weapons:['kinetic'],weapon:'kinetic',drones:['aegis'],drone:'aegis',
 dmgMul:1,rateMul:1,droneRateMul:1,multishot:1,cd:0,dcd:0,da:0,inv:0,ups:[],shield:false,shieldT:0,pulseT:5,slow:1,dpos:{x:0,y:0}}}
function startGame(){S={state:'play',floor:0,p:newPlayer(),t:0,texts:[],stats:{kills:0,shots:0,dmg:0,taken:0,time:0}};startFloor()}
function startFloor(){const f=FLOORS[S.floor];S.f=f;S.obj=OBJECTIVES[f.objective];
 S.walls=f.walls.map(([cx,cy,cw,ch])=>({x:cx*CELL,y:cy*CELL,w:cw*CELL,h:ch*CELL}));
 S.grid=new Uint8Array(GW*GH);for(let y=0;y<GH;y++)for(let x=0;x<GW;x++)S.grid[x+y*GW]=S.walls.some(w=>cp(x)>w.x&&cp(x)<w.x+w.w&&cp(y)>w.y&&cp(y)<w.y+w.h)?1:0;
 S.flow=new Int16Array(GW*GH);S.flowT=0;
 Object.assign(S.p,P(...f.spawn));S.enemies=[];S.bullets=[];S.ebullets=[];S.parts=[];S.arcs=[];S.rings=[];S.exit=null;S.choices=null;S.texts=[];
 S.winds=null;S.well=null;S.obj.setup(S,f);S.waveT=2;S.wave=0;S.cleared=false;showBanner(`FLOOR ${S.floor+1} — ${f.name.toUpperCase()}`,f.task,3.5)}
function showBanner(a,b,t){S.banner={a,b,life:t}}
function floatText(x,y,t,col){S.texts.push({x,y,t,col:col||'#bff',life:1.6})}
const scaleF=()=>({hp:1+S.floor*.22,spd:1+S.floor*.04,count:1+S.floor*.12});

// ================= WORLD =================
function inWall(x,y){if(x<0||y<0||x>W||y>H)return true;for(const w of S.walls)if(x>w.x&&x<w.x+w.w&&y>w.y&&y<w.y+w.h)return true;return false}
function los(a,b){const d=dist(a,b),n=Math.ceil(d/14);for(let i=1;i<n;i++){const t=i/n;if(inWall(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t))return false}return true}
function resolve(o){for(const w of S.walls){const nx=clamp(o.x,w.x,w.x+w.w),ny=clamp(o.y,w.y,w.y+w.h);let dx=o.x-nx,dy=o.y-ny,d2=dx*dx+dy*dy;
  if(d2<o.r*o.r){if(d2===0){const l=o.x-w.x,r=w.x+w.w-o.x,t=o.y-w.y,b=w.y+w.h-o.y,m=Math.min(l,r,t,b);
    if(m===l)o.x=w.x-o.r;else if(m===r)o.x=w.x+w.w+o.r;else if(m===t)o.y=w.y-o.r;else o.y=w.y+w.h+o.r}
   else{const d=Math.sqrt(d2);o.x+=dx/d*(o.r-d);o.y+=dy/d*(o.r-d)}}}
 o.x=clamp(o.x,o.r,W-o.r);o.y=clamp(o.y,o.r,H-o.r)}
function buildFlow(){const p=S.p,D=S.flow;D.fill(9999);const s=clamp(Math.floor(p.x/CELL),0,GW-1)+clamp(Math.floor(p.y/CELL),0,GH-1)*GW;D[s]=0;const q=[s];let h=0;
 while(h<q.length){const i=q[h++],x=i%GW,y=(i/GW)|0;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=GW||ny>=GH)continue;const j=nx+ny*GW;if(S.grid[j]||D[j]<=D[i]+1)continue;D[j]=D[i]+1;q.push(j)}}}
function chaseAngle(e){const p=S.p,direct=Math.atan2(p.y-e.y,p.x-e.x);const d=dist(e,p);if(d<220&&los(e,p))return direct;
 const cx=clamp(Math.floor(e.x/CELL),0,GW-1),cy=clamp(Math.floor(e.y/CELL),0,GH-1),D=S.flow;let best=D[cx+cy*GW],bx=-1,by=-1;
 for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=GW||ny>=GH)continue;
  if(dx&&dy&&(S.grid[cx+dx+cy*GW]||S.grid[cx+(cy+dy)*GW]))continue;const v=D[nx+ny*GW];if(v<best){best=v;bx=nx;by=ny}}
 return bx<0?direct:Math.atan2(cp(by)-e.y,cp(bx)-e.x)}
